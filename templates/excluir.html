{% extends "base.html" %}

{% block css %}
<link rel="stylesheet" href="{{ url_for('static', filename='excluir.css') }}">
{% endblock %}

{% block conteudo %}
    
    <main class="excluir">
        <header class="excluir-cabecalho">
            <span class="excluir-icone" aria-hidden="true">
                <i class="fa-solid fa-trash"></i>
            </span>
            <div>
                <h1>Excluir produto</h1>
                <p>Digite o ID do produto que deseja excluir.</p>
            </div>
        </header>

        <form method="POST" action="{{ url_for('excluir') }}">
            <div class="campo">
                <span class="campo-icone" aria-hidden="true">
                    <i class="fa-solid fa-box"></i>
                </span>
                <div class="campo-controle">
                    <label for="id-produto">ID do produto</label>
                    <input id="id-produto" type="number" name="id_produto" placeholder="Digite o ID do produto" value="{{ request.args.get('id_produto', '') }}" step="1" required>
                </div>
            </div>

            <p class="aviso-exclusao">
                <i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>
                Essa ação não pode ser desfeita.
            </p>

            <button type="submit">
                <i class="fa-solid fa-trash" aria-hidden="true"></i>
                Excluir produto
            </button>

            <a class="voltar" href="{{ url_for('listar_produtos') }}">
                <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
                Voltar
            </a>
        </form>
    </main>

    {% endblock %}
